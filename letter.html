<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Every Letter — In Order</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --sky-deep:      #0A0F24;
    --panel:         #161E42;
    --panel-line:    rgba(226, 224, 240, 0.10);
    --ink:           #F2EFE6;
    --ink-muted:     #9BA2C7;
    --lantern:       #E3A857;
    --lantern-dim:   rgba(227, 168, 87, 0.35);

    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--sky-deep);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.65;
    overflow-x: hidden;
  }

  ::selection{ background: var(--lantern-dim); color: var(--ink); }
  a{ color: var(--lantern); }
  :focus-visible{ outline: 2px solid var(--lantern); outline-offset: 3px; }

  #starfield{ position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  .sky-veil{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(10,15,36,0.55) 0%, rgba(10,15,36,0.15) 18%, rgba(10,15,36,0.15) 82%, rgba(10,15,36,0.65) 100%);
  }

  main{ position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: clamp(3rem, 8vw, 5rem) clamp(1.5rem, 6vw, 2rem) 6rem; }

  h1, h2, h3{ font-family: var(--serif); font-weight: 500; margin: 0; }

  .top-nav{
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: clamp(2.5rem, 8vw, 4rem);
    font-size: 0.92rem;
  }
  .top-nav a{ text-decoration: none; border-bottom: 1px solid var(--lantern-dim); padding-bottom: 2px; }
  .top-nav a:hover{ border-color: var(--lantern); }

  .page-title{ font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 0.6rem; }
  .page-sub{ color: var(--ink-muted); margin-bottom: clamp(3rem, 8vw, 4.5rem); }

  /* ============ LETTER CARDS ============ */
  #lettersContainer{ display: flex; flex-direction: column; gap: 1.8rem; }

  .letter-card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: clamp(1.6rem, 4vw, 2.6rem);
    opacity: 0;
    transform: translateY(28px);
  }

  .letter-date{ display: block; font-size: 0.8rem; color: var(--lantern); margin-bottom: 0.5rem; letter-spacing: 0.01em; }
  .letter-title{ font-size: clamp(1.3rem, 2.4vw, 1.7rem); margin-bottom: 1rem; }

  .letter-body p{ color: var(--ink-muted); margin: 0 0 1em 0; font-size: 1.02rem; }
  .letter-body p:last-child{ margin-bottom: 0; }

  .letter-images{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.7rem;
    margin-top: 1.4rem;
  }
  .letter-images img{
    width: 100%; height: 160px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--panel-line); display: block; background: rgba(255,255,255,0.03);
  }

  .empty-state, .error-state{
    color: var(--ink-muted);
    font-style: italic;
    padding: 2rem 0;
  }

  .error-state a{ font-style: normal; }

  footer{
    text-align: center; margin-top: clamp(3rem, 8vw, 5rem);
    color: var(--ink-muted); font-family: var(--serif); font-style: italic; font-size: 1.1rem;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    .letter-card{ opacity: 1 !important; transform: none !important; }
  }





  /* =========================================================
   RESPONSIVE LAYER  (350px → 1500px)
========================================================= */
:root{ --gutter: clamp(1rem, 5vw, 2rem); }
html{ -webkit-text-size-adjust: 100%; }
img{ max-width: 100%; }

/* Fixed canvas: use dynamic viewport units so mobile toolbars don't leave gaps */
#starfield{ height: 100vh; height: 100dvh; }

/* ---------- Page frame ---------- */
main{
  padding: clamp(2rem, 7vw, 5rem) var(--gutter) clamp(3.5rem, 8vw, 6rem);
}

/* ---------- Top nav: wrap instead of colliding on narrow screens ---------- */
.top-nav{
  flex-wrap: wrap;
  gap: .6rem 1.5rem;
  font-size: clamp(.85rem, .8rem + .2vw, .95rem);
}
.top-nav a{
  display: inline-block;
  padding: .35rem 0;           /* larger touch target */
}

/* ---------- Headings ---------- */
.page-title{
  font-size: clamp(1.75rem, 1.1rem + 3.2vw, 2.9rem);
  line-height: 1.12;
  overflow-wrap: break-word;
}
.page-sub{ font-size: clamp(.95rem, .9rem + .25vw, 1.05rem); }

/* ---------- Letter cards ---------- */
#lettersContainer{ gap: clamp(1rem, 3vw, 1.8rem); }

.letter-card{ padding: clamp(1.1rem, 4.5vw, 2.6rem); }

.letter-title{
  font-size: clamp(1.2rem, 1rem + 1.1vw, 1.75rem);
  line-height: 1.25;
  overflow-wrap: break-word;
}
.letter-body p{
  font-size: clamp(.97rem, .93rem + .2vw, 1.06rem);
  overflow-wrap: break-word;   /* long words/URLs can't push the card wider */
}

/* ---------- Letter images ---------- */
.letter-images{
  grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr));
  gap: clamp(.5rem, 2vw, .9rem);
}
.letter-images img{ height: clamp(110px, 26vw, 200px); }

/* ---------- Empty / error states ---------- */
.empty-state, .error-state{ overflow-wrap: break-word; }

/* ---------- Footer ---------- */
footer{
  font-size: clamp(.98rem, .93rem + .25vw, 1.15rem);
  overflow-wrap: break-word;
}

/* ---------- Very small phones (350–480px) ---------- */
@media (max-width: 480px){
  .top-nav{ justify-content: flex-start; }
  .letter-card{ border-radius: 5px; }
}

/* ---------- Large screens (≥1100px) ---------- */
@media (min-width: 1100px){
  main{ max-width: 820px; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="sky-veil"></div>

<main>
  <div class="top-nav">
    <a href="index.html">← Back home</a>
    <a href="index.html#reply">Leave a message →</a>
  </div>

  <h1 class="page-title">My Days in Night</h1>
  <p class="page-sub">Updates Every Weekend or 10th of the Month</p>

  <div id="lettersContainer">
    <p class="empty-state">Loading…</p>
  </div>

  <footer>The promise that I made was being loyal in friendship. Aur ye he meri wafadari</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<script>
(function(){
  "use strict";

  var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* =========================================================
     AMBIENT STARFIELD (same as homepage, always night here)
  ========================================================== */
  var canvas = document.getElementById("starfield");
  var renderer, scene, camera, stars, starsFar;
  var targetZ = 40, currentZ = 40, clockT = 0;

  function initStarfield(){
    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.z = currentZ;

    stars = makeStarField(1600, 220, 0xF2EFE6, 0.9);
    starsFar = makeStarField(900, 340, 0xE3A857, 0.55);
    scene.add(stars);
    scene.add(starsFar);

    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    animate();
  }

  function makeStarField(count, spread, color, size){
    var geometry = new THREE.BufferGeometry();
    var positions = new Float32Array(count * 3);
    for (var i = 0; i < count; i++){
      positions[i*3]     = (Math.random() - 0.5) * spread;
      positions[i*3 + 1] = (Math.random() - 0.5) * spread;
      positions[i*3 + 2] = (Math.random() - 0.5) * spread;
    }
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    var material = new THREE.PointsMaterial({ color: color, size: size, transparent: true, opacity: 0.85, sizeAttenuation: true });
    return new THREE.Points(geometry, material);
  }

  function onResize(){
    if (!renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onScroll(){
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var progress = docHeight > 0 ? window.scrollY / docHeight : 0;
    targetZ = 40 - progress * 70;
  }

  function animate(){
    requestAnimationFrame(animate);
    clockT += 0.0025;
    if (!prefersReducedMotion){
      currentZ += (targetZ - currentZ) * 0.06;
      camera.position.z = currentZ;
      stars.rotation.y = clockT * 0.15;
      starsFar.rotation.y = -clockT * 0.08;
    } else {
      camera.position.z = 40;
    }
    renderer.render(scene, camera);
  }

  if (window.WebGLRenderingContext){
    try { initStarfield(); } catch(e) { /* fail silently */ }
  }

  /* =========================================================
     LOAD messages.json, sort newest-first, render one
     self-contained card per entry
  ========================================================== */
  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso){
    try{
      var d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    } catch(e){ return iso; }
  }

  function buildImages(images){
    if (!images || images.length === 0) return "";
    var tags = images.map(function(src){
      return "<img src=\"" + escapeHtml(src) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.style.display='none'\">";
    }).join("");
    return "<div class=\"letter-images\">" + tags + "</div>";
  }

  function buildParagraphs(message){
    var lines = (message || "").split(/\n+/).filter(function(l){ return l.trim().length > 0; });
    if (lines.length === 0) return "<p></p>";
    return lines.map(function(l){ return "<p>" + escapeHtml(l) + "</p>"; }).join("");
  }

  function renderLetters(messages){
    var container = document.getElementById("lettersContainer");

    if (!messages || messages.length === 0){
      container.innerHTML = "<p class=\"empty-state\">Nothing written yet — check back soon.</p>";
      return;
    }

    // messages.json is authored oldest-to-newest (just append new entries at the
    // end); reverse it here so the newest one renders first, on top.
    var ordered = messages.slice().reverse();

    container.innerHTML = ordered.map(function(m){
      return "<article class=\"letter-card\">" +
        "<span class=\"letter-date\">" + escapeHtml(formatDate(m.date || "")) + "</span>" +
        "<h2 class=\"letter-title\">" + escapeHtml(m.title || "Untitled") + "</h2>" +
        "<div class=\"letter-body\">" + buildParagraphs(m.message) + "</div>" +
        buildImages(m.images) +
      "</article>";
    }).join("");

    setupReveal();
  }

  function setupReveal(){
    var cards = document.querySelectorAll(".letter-card");
    if (typeof anime === "undefined" || prefersReducedMotion){
      cards.forEach(function(c){ c.style.opacity = 1; c.style.transform = "none"; });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        anime({ targets: entry.target, opacity: [0, 1], translateY: [28, 0], duration: 800, easing: "easeOutCubic" });
        io.unobserve(entry.target);
      });
    }, { threshold: 0.15 });
    cards.forEach(function(c){ io.observe(c); });
  }

  function loadMessages(){
    var container = document.getElementById("lettersContainer");
    fetch("messages.json").then(function(res){
      if (!res.ok) throw new Error("could not load messages.json");
      return res.json();
    }).then(function(data){
      renderLetters(data && data.messages ? data.messages : []);
    }).catch(function(){
      container.innerHTML = "<p class=\"error-state\">Couldn't load the letters. If you're opening this file " +
        "directly from your computer, browsers block that for security \u2014 " +
        "run it from a local server (or upload both files to any static host) instead. " +
        "<a href=\"index.html\">Back home</a></p>";
    });
  }

  loadMessages();

})();
</script>

</body>
</html>
